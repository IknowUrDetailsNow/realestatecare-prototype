<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <title>RealEstateCare — Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f0f2f5;
      color: #1a1a1a;
    }
    .app-header {
      padding: 16px 24px;
      background: #1a3c5e;
      color: #fff;
    }
    .app-header h1 {
      margin: 0;
      font-size: 20px;
    }
    main.dashboard {
      padding: 24px;
      max-width: 720px;
      margin: 0 auto;
    }
    .dashboard-tiles {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .dashboard-tiles button {
      flex: 1 1 45%;
      padding: 16px;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      font-size: 14px;
    }
    .dashboard-tiles button:hover {
      background: #f5f7fa;
    }
    .inspection-list {
      margin-top: 24px;
    }
    .list {
      list-style: none;
      margin: 0;
      padding: 0;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
    }
    .list-item {
      display: flex;
      gap: 16px;
      padding: 12px 16px;
      cursor: pointer;
      border-bottom: 1px solid #e0e0e0;
    }
    .list-item:last-child {
      border-bottom: none;
    }
    .list-item:hover {
      background: #f5f7fa;
    }
    .list-item.active {
      background: #e8f0fe;
    }
    .date {
      min-width: 90px;
      color: #555;
    }
    .type {
      margin-left: auto;
      text-transform: capitalize;
      color: #777;
    }
    .error {
      color: #b00020;
    }
    .inspection-detail {
      margin-top: 16px;
      padding: 16px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      background: #fafafa;
    }
    .inspection-detail dl {
      display: grid;
      grid-template-columns: 140px 1fr;
      row-gap: 8px;
      margin: 0;
    }
    .inspection-detail dt {
      font-weight: 600;
      color: #444;
    }
    .inspection-detail dd {
      margin: 0;
    }
  </style>
</head>
<body>
  <header class="app-header">
    <h1>RealEstateCare — Dashboard</h1>
  </header>

  <main class="dashboard">
    <nav class="dashboard-tiles">
      <button type="button">Toegewezen rapportages</button>
      <button type="button">Uitgevoerde rapportages</button>
      <button type="button">Kennisbase/documentatie</button>
      <button type="button">Instellingen</button>
    </nav>

    <!--
      Nieuw onderdeel voor deze opdracht: de lijst met uitgevoerde
      inspecties (op datum gesorteerd), incl. detailweergave bij
      aanklikken. Wordt door script.js gevuld.
    -->
    <section id="inspection-list" class="inspection-list">
      <h2>Uitgevoerde inspecties</h2>
      <div id="inspection-list-body"><p>Inspecties laden...</p></div>
      <div id="inspection-detail-body"></div>
    </section>
  </main>

  <script>
    /* =============================================================
     * RealEstateCare — Inspecties
     * =============================================================
     * Bevat, in dit ene script, alles wat de opdracht vraagt:
     *   1. Het datamodel      -> zie het JSDoc-typedef "Inspection"
     *   2. De service         -> InspectionService (doet de API-call)
     *   3. De lijst-component -> InspectionListComponent
     *   4. De detail-component-> InspectionDetailComponent
     *
     * Hoort bij: inspections.json (de mock data / bron voor de web API).
     *
     * Hoe te draaien, LOKAAL (voor tijdens het bouwen/testen, geen
     * npm/build-tool nodig):
     *   1. Zet index.html en db.json in dezelfde map.
     *   2. Start vanuit die map een simpele lokale webserver, bv.:
     *        python3 -m http.server 8000
     *      of, als je node hebt:
     *        npx http-server -p 8000
     *   3. Open http://localhost:8000 in je browser.
     *
     * Hoe te draaien met een ECHTE web API (voor de inlevering, zoals
     * de opdracht vraagt — "dit mag bijvoorbeeld MyJSONServer zijn"):
     *   1. Zorg dat db.json in de root van je GitHub-repo staat (dat
     *      moet toch, want je publiceert je prototype daar sowieso).
     *   2. Zet API_URL hieronder op:
     *        "https://my-json-server.typicode.com/JOUW-GEBRUIKERSNAAM/JOUW-REPO/inspections"
     *      (MyJSONServer leest jouw db.json en zet elke top-level key
     *      -- hier "inspections" -- automatisch om in een los
     *      REST-endpoint dat je met een gewone API-call kunt aanroepen.)
     *   3. Klaar — de rest van de code hoeft niet te veranderen; de
     *      service hieronder herkent zelf of hij een los array
     *      (van MyJSONServer) of het lokale db.json-bestand
     *      (met een "inspections"-property) binnenkrijgt.
     * ============================================================= */

    /**
     * @typedef {"damage"|"maintenance"|"installation"|"modification"} InspectionType
     *
     * Datamodel — komt 1-op-1 overeen met de velden in db.json.
     * @typedef {Object} Inspection
     * @property {string} id
     * @property {string} propertyAddress
     * @property {InspectionType} inspectionType
     * @property {string} inspectionDate  ISO 8601-datumnotatie: yyyy-MM-dd
     * @property {string} inspectorName
     * @property {string} description
     */

    const ALLOWED_INSPECTION_TYPES = ["damage", "maintenance", "installation", "modification"];

    /**
     * Het datamodel in de praktijk: zet een los, ongevalideerd JSON-
     * object om in een gestructureerde, gevalideerde Inspection.
     * Ontbreekt er een verplicht veld, of klopt het inspectionType
     * niet, dan gooit dit een duidelijke fout — zo structureert het
     * model daadwerkelijk de binnenkomende data, in plaats van alleen
     * te documenteren hoe die eruit hoort te zien.
     *
     * @param {*} raw
     * @returns {Inspection}
     */
    function createInspection(raw) {
      if (!raw || typeof raw !== "object") {
        throw new Error("Ongeldige inspectie: verwacht een object.");
      }
      const { id, propertyAddress, inspectionType, inspectionDate, inspectorName, description } = raw;

      if (!id || !propertyAddress || !inspectionDate || !inspectorName || !description) {
        throw new Error(`Ongeldige inspectie (id: ${id}): een verplicht veld ontbreekt.`);
      }
      if (!ALLOWED_INSPECTION_TYPES.includes(inspectionType)) {
        throw new Error(`Ongeldige inspectie (id: ${id}): onbekend inspectionType "${inspectionType}".`);
      }

      return { id, propertyAddress, inspectionType, inspectionDate, inspectorName, description };
    }

    // ---------------------------------------------------------------
    // 2. Service — doet de (asynchrone) API-call, gescheiden van de
    //    componenten hieronder, en structureert de respons via het
    //    datamodel (createInspection) voordat de data verder gaat.
    // ---------------------------------------------------------------
    const API_URL = "db.json";

    const InspectionService = {
      /** @returns {Promise<Inspection[]>} */
      async getInspections() {
        const response = await fetch(API_URL);
        if (!response.ok) {
          throw new Error(`API-call mislukt: HTTP ${response.status}`);
        }
        const payload = await response.json();

        // MyJSONServer geeft de collectie direct als array terug
        // (GET .../inspections); het lokale db.json geeft het hele
        // bestand terug, met de array onder de "inspections"-key.
        const rawInspections = Array.isArray(payload) ? payload : payload.inspections;

        return rawInspections.map(createInspection);
      },
    };

    // ---------------------------------------------------------------
    // 3. Lijst-component — rendert de inspecties, op datum gesorteerd.
    // ---------------------------------------------------------------
    function formatDate(isoDate) {
      const [year, month, day] = isoDate.split("-");
      return `${day}-${month}-${year}`;
    }

    const InspectionListComponent = {
      /**
       * @param {Inspection[]} inspections
       * @param {(inspection: Inspection) => void} onSelect
       */
      render(inspections, onSelect) {
        const container = document.getElementById("inspection-list-body");

        if (!inspections.length) {
          container.innerHTML = "<p>Er zijn nog geen inspecties uitgevoerd.</p>";
          return;
        }

        const sorted = [...inspections].sort(
          (a, b) => new Date(b.inspectionDate) - new Date(a.inspectionDate)
        );

        const list = document.createElement("ul");
        list.className = "list";

        sorted.forEach((inspection) => {
          const item = document.createElement("li");
          item.className = "list-item";
          item.dataset.id = inspection.id;
          item.innerHTML = `
            <span class="date">${formatDate(inspection.inspectionDate)}</span>
            <span class="address">${inspection.propertyAddress}</span>
            <span class="type">${inspection.inspectionType}</span>
          `;
          item.addEventListener("click", () => {
            document
              .querySelectorAll(".list-item")
              .forEach((el) => el.classList.remove("active"));
            item.classList.add("active");
            onSelect(inspection);
          });
          list.appendChild(item);
        });

        container.innerHTML = "";
        container.appendChild(list);
      },

      renderError(message) {
        const container = document.getElementById("inspection-list-body");
        container.innerHTML = `<p class="error">${message}</p>`;
      },
    };

    // ---------------------------------------------------------------
    // 4. Detail-component — toont de details van de geselecteerde
    //    inspectie, onder de lijst.
    // ---------------------------------------------------------------
    const InspectionDetailComponent = {
      /** @param {Inspection} inspection */
      render(inspection) {
        const container = document.getElementById("inspection-detail-body");
        container.innerHTML = `
          <article class="inspection-detail">
            <h3>Details van de inspectie</h3>
            <dl>
              <dt>Adres</dt>
              <dd>${inspection.propertyAddress}</dd>

              <dt>Type inspectie</dt>
              <dd>${inspection.inspectionType}</dd>

              <dt>Datum</dt>
              <dd>${formatDate(inspection.inspectionDate)}</dd>

              <dt>Inspecteur</dt>
              <dd>${inspection.inspectorName}</dd>

              <dt>Omschrijving</dt>
              <dd>${inspection.description}</dd>
            </dl>
          </article>
        `;
      },
    };

    // ---------------------------------------------------------------
    // App-initialisatie: haal de data op via de service, en render
    // daarna de lijst-component.
    // ---------------------------------------------------------------
    InspectionService.getInspections()
      .then((inspections) => {
        InspectionListComponent.render(inspections, (inspection) => {
          InspectionDetailComponent.render(inspection);
        });
      })
      .catch((error) => {
        InspectionListComponent.renderError(
          "De inspecties konden niet worden opgehaald van de API."
        );
        console.error(error);
      });
  </script>
</body>
</html>
